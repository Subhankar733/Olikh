name: Build OLIKH APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olikh-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Android Fast Unit & Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Lint Gate
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olikh-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

  build:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          OLIKH_KEYSTORE_BASE64: ${{ secrets.OLIKH_KEYSTORE_BASE64 }}
        run: |
          echo "$OLIKH_KEYSTORE_BASE64" | base64 --decode > olikh-release.jks
          chmod 600 olikh-release.jks
          test -s olikh-release.jks

      - name: Build signed Release APK
        env:
          OLIKH_KEYSTORE_PATH: ${{ github.workspace }}/olikh-release.jks
          OLIKH_KEYSTORE_PASSWORD: ${{ secrets.OLIKH_KEYSTORE_PASSWORD }}
          OLIKH_KEY_ALIAS: ${{ secrets.OLIKH_KEY_ALIAS }}
          OLIKH_KEY_PASSWORD: ${{ secrets.OLIKH_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLIKH-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "OLIKH Build #${{ github.run_number }}" \
            --generate-notes

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f olikh-release.jks
