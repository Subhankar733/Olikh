name: Build OLIKH APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olikh-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Android Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true

      - name: Build debug APK and test APK
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set +e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            gradle connectedDebugAndroidTest --stacktrace
            test_status=$?
            echo "===== OLIKH TEST LOGCAT =====" > olikh-logcat.txt
            adb logcat -d -v threadtime >> olikh-logcat.txt 2>&1 || true
            exit "$test_status"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olikh-android-smoke-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: olikh-smoke-test-logcat
          path: olikh-logcat.txt
          if-no-files-found: warn

  build:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          OLIKH_KEYSTORE_BASE64: ${{ secrets.OLIKH_KEYSTORE_BASE64 }}
        run: |
          echo "$OLIKH_KEYSTORE_BASE64" | base64 --decode > olikh-release.jks
          chmod 600 olikh-release.jks
          test -s olikh-release.jks

      - name: Build signed Release APK
        env:
          OLIKH_KEYSTORE_PATH: ${{ github.workspace }}/olikh-release.jks
          OLIKH_KEYSTORE_PASSWORD: ${{ secrets.OLIKH_KEYSTORE_PASSWORD }}
          OLIKH_KEY_ALIAS: ${{ secrets.OLIKH_KEY_ALIAS }}
          OLIKH_KEY_PASSWORD: ${{ secrets.OLIKH_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLIKH-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "OLIKH Build #${{ github.run_number }}" \
            --generate-notes

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f olikh-release.jks
