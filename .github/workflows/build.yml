name: Build OLIKH APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          OLIKH_KEYSTORE_BASE64: ${{ secrets.OLIKH_KEYSTORE_BASE64 }}
        run: |
          echo "$OLIKH_KEYSTORE_BASE64" | base64 --decode > olikh-release.jks
          chmod 600 olikh-release.jks
          test -s olikh-release.jks
          echo "Release keystore restored successfully."

      - name: Build signed Release APK
        env:
          OLIKH_KEYSTORE_PATH: ${{ github.workspace }}/olikh-release.jks
          OLIKH_KEYSTORE_PASSWORD: ${{ secrets.OLIKH_KEYSTORE_PASSWORD }}
          OLIKH_KEY_ALIAS: ${{ secrets.OLIKH_KEY_ALIAS }}
          OLIKH_KEY_PASSWORD: ${{ secrets.OLIKH_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          echo "Signed release APK created successfully."

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OLIKH-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f olikh-release.jks
