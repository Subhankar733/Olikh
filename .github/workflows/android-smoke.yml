name: OLIKH Android Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olikh-android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run on Android emulator
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SERIAL="emulator-5554"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"

          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"

          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            'platform-tools' \
            'emulator' \
            'platforms;android-30' \
            'system-images;android-30;google_apis;x86_64'

          echo "Creating smoke-test AVD..."

          echo no | avdmanager create avd \
            --force \
            --name smoke-test \
            --package 'system-images;android-30;google_apis;x86_64' \
            --device 'pixel_2'

          echo "===== AVD CHECK ====="
          avdmanager list avd
          echo "===== EMULATOR LIST ====="
          emulator -list-avds

          emulator -list-avds | grep -Fx "smoke-test" >/dev/null || {
            echo "ERROR: smoke-test AVD was not created in $ANDROID_AVD_HOME"
            find "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" -maxdepth 3 -type f -print || true
            exit 1
          }

          cleanup() {
            adb -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
            pkill -f 'emulator.*-avd smoke-test' >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Starting smoke-test emulator..."

          emulator -avd smoke-test \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -no-metrics \
            -gpu software \
            -accel auto \
            -cores 2 \
            -memory 2048 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

          adb start-server >/dev/null

          echo "Waiting for emulator..."

          for i in {1..180}; do
            if adb -s "$ANDROID_SERIAL" get-state 2>/dev/null | grep -q '^device$'; then
              boot_completed="$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

              if [ "$boot_completed" = "1" ]; then
                echo "Emulator booted successfully."
                break
              fi
            fi

            if [ "$i" -eq 180 ]; then
              echo "ERROR: Emulator failed to boot within 6 minutes."
              echo "===== EMULATOR LOG ====="
              cat "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            sleep 2
          done

          echo "Waiting for Android package manager..."
          for i in {1..30}; do
            if adb -s "$ANDROID_SERIAL" shell pm path android >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          sleep 15

          echo "Installing OLIKH APK without streamed install..."

          installed=0
          for attempt in 1 2 3; do
            echo "APK install attempt $attempt/3"

            if adb -s "$ANDROID_SERIAL" push \
                app/build/outputs/apk/debug/app-debug.apk \
                /data/local/tmp/olikh-debug.apk && \
               adb -s "$ANDROID_SERIAL" shell pm install -r \
                /data/local/tmp/olikh-debug.apk; then
              installed=1
              break
            fi

            echo "APK install attempt $attempt failed; reconnecting ADB..."
            adb reconnect offline >/dev/null 2>&1 || true
            sleep 10
          done

          if [ "$installed" -ne 1 ]; then
            echo "ERROR: OLIKH APK could not be installed."
            adb -s "$ANDROID_SERIAL" shell getprop || true
            exit 1
          fi

          echo "Launching OLIKH..."

          adb -s "$ANDROID_SERIAL" shell am force-stop com.subho.olikh

          adb -s "$ANDROID_SERIAL" shell am start -W \
            -n com.subho.olikh/.MainActivity

          sleep 10

          echo "Checking OLIKH process..."

          adb -s "$ANDROID_SERIAL" shell pidof com.subho.olikh

          adb -s "$ANDROID_SERIAL" shell dumpsys activity activities \
            | grep -F "com.subho.olikh"

          echo "OLIKH emulator smoke test passed."
